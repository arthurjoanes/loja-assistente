[project]
name = "loja-assistente"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1", "pydantic==2.13.5", "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.54", "psycopg[binary]==3.3.6", "alembic==1.20.0",
  "argon2-cffi==25.1.0", "uvicorn==0.53.0", "httpx==0.28.1", "openai==3.16.2",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.8", "mypy==2.3.1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", ".."]
addopts = "-ra"
