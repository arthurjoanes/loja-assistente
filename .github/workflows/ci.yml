name: Local stack checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  secret-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP" gitleaks
      - name: Scan complete history
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --log-opts=--all .'
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify published evidence without API calls
        run: python3 scripts/verify_evidence.py
      - name: Configure isolated local demo
        run: python3 scripts/setup_env.py
      - name: Build
        run: |
          docker compose build backend
          docker compose build frontend
      - name: Scan application runtime images
        run: |
          for image in pf-loja-assistente-backend:local pf-loja-assistente-frontend:latest; do
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock:ro \
              --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/" \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --scanners vuln --ignorefile /dev/null \
              --severity HIGH,CRITICAL --exit-code 1 "$image"
          done
      - name: PostgreSQL integration, contracts, lint, types and evaluations
        run: docker compose --profile test run --rm test
      - name: Ensure verification preserved the published evaluation
        run: python3 scripts/verify_evidence.py
      - name: Frontend checks
        run: |
          docker compose --profile test build frontend-check
          docker compose --profile test run --rm frontend-check
      - name: Documented installation and HTTP demonstration
        run: |
          docker compose up -d --wait db
          docker compose run --rm backend alembic upgrade head
          docker compose run --rm backend python -m loja_assistente.seed
          docker compose up -d --wait backend frontend
          docker compose run --rm --env DEMO_REPORT=/tmp/demo-results.json backend python /app/scripts/demo_check.py
      - name: Browser journeys
        run: |
          docker compose -f compose.e2e.yaml build backend
          docker compose -f compose.e2e.yaml build frontend
          docker compose -f compose.e2e.yaml build e2e
          docker compose -f compose.e2e.yaml up --abort-on-container-exit --exit-code-from e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verification-evidence
          path: |
            evals/reports
            docs/screenshots
      - name: Stop project containers
        if: always()
        run: |
          docker compose -f compose.e2e.yaml down --volumes
          docker compose --profile test down
