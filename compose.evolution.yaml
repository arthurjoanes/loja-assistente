# Sources are copied and built by scripts/prove_evolution.py before this stack runs.
services:
  db:
    image: ${PROOF_DB_IMAGE:?immutable image required}
    labels: {portfolio.evolution: '${PROOF_RUN_ID:?run id required}'}
    environment: {POSTGRES_DB: evolution_demo, POSTGRES_USER: proof, POSTGRES_PASSWORD: synthetic-evolution-only}
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U proof -d evolution_demo]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
  test-db:
    image: ${PROOF_DB_IMAGE}
    labels: {portfolio.evolution: '${PROOF_RUN_ID}'}
    environment: {POSTGRES_DB: evolution_test, POSTGRES_USER: proof, POSTGRES_PASSWORD: synthetic-evolution-only}
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U proof -d evolution_test]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
  checks:
    image: ${PROOF_BACKEND_IMAGE:?immutable image required}
    labels: {portfolio.evolution: '${PROOF_RUN_ID}'}
    environment:
      DATABASE_URL: postgresql+psycopg://proof:synthetic-evolution-only@test-db:5432/evolution_test
      TEST_DATABASE_URL: postgresql+psycopg://proof:synthetic-evolution-only@test-db:5432/evolution_test
      SESSION_SECRET: synthetic-local-evolution-session-secret
      DEMO_MODE: 'true'
      LLM_ENABLED: 'false'
      OPENAI_API_KEY: ''
      RUFF_CACHE_DIR: /tmp/ruff-cache
      MYPY_CACHE_DIR: /tmp/mypy-cache
      PYTEST_ADDOPTS: '--junitxml=/artifacts/backend-tests.xml -o cache_dir=/tmp/pytest-cache'
    volumes:
      - ${PROOF_OUTPUT_DIR:?output required}:/artifacts
      - ${PROOF_OUTPUT_DIR}/offline-evaluation:/app/evals/reports/local
    depends_on:
      test-db: {condition: service_healthy}
    command: [python, /app/scripts/check.py]
    mem_limit: 1024m
  backend:
    image: ${PROOF_BACKEND_IMAGE}
    labels: {portfolio.evolution: '${PROOF_RUN_ID}'}
    environment:
      DATABASE_URL: postgresql+psycopg://proof:synthetic-evolution-only@db:5432/evolution_demo
      SESSION_SECRET: synthetic-local-evolution-session-secret
      DEMO_MODE: 'true'
      COOKIE_SECURE: 'false'
      ALLOWED_ORIGINS: '["http://frontend:3102"]'
      REFERENCE_DATE: '2026-08-17'
      DATASET_VERSION: synthetic-v1
      LLM_ENABLED: 'false'
      OPENAI_API_KEY: ''
    command: [sh, -c, 'alembic upgrade head && python -m loja_assistente.seed && exec uvicorn loja_assistente.app:app --host 0.0.0.0 --port 8102 --no-proxy-headers']
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8102/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 768m
  frontend:
    image: ${PROOF_FRONTEND_IMAGE:?immutable image required}
    labels: {portfolio.evolution: '${PROOF_RUN_ID}'}
    environment: {BACKEND_URL: 'http://backend:8102', PORT: '3102', HOSTNAME: 0.0.0.0}
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3102').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m
  frontend-checks:
    image: ${PROOF_FRONTEND_CHECKS_IMAGE:?immutable image required}
    labels: {portfolio.evolution: '${PROOF_RUN_ID}'}
    mem_limit: 1024m
  e2e:
    image: ${PROOF_E2E_IMAGE:?immutable image required}
    labels: {portfolio.evolution: '${PROOF_RUN_ID}'}
    environment:
      E2E_BASE_URL: http://frontend:3102
      SCREENSHOT_DIR: /artifacts/screenshots
      STORY_OUTPUT_DIR: /artifacts/story
    volumes:
      - ${PROOF_OUTPUT_DIR}:/artifacts
      - ${PROOF_OUTPUT_DIR}/playwright:/app/test-results
    depends_on:
      frontend: {condition: service_healthy}
    shm_size: 256m
    mem_limit: 1536m
networks:
  default:
    internal: true
    labels: {portfolio.evolution: '${PROOF_RUN_ID}'}
    ipam:
      config: [{subnet: '${PROOF_SUBNET:?inspected free subnet required}'}]
