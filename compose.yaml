name: pf-loja-assistente
services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: loja_assistente
      POSTGRES_USER: loja_assistente
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute scripts/dev.ps1 setup primeiro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U loja_assistente -d loja_assistente']
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m
  backend:
    image: pf-loja-assistente-backend:local
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &backend_environment
      DATABASE_URL: postgresql+psycopg://loja_assistente:${POSTGRES_PASSWORD}@db:5432/loja_assistente
      SESSION_SECRET: ${SESSION_SECRET:?Execute scripts/dev.ps1 setup primeiro}
      DEMO_MODE: ${DEMO_MODE:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: '["http://localhost:${FRONTEND_PORT:-3102}","http://127.0.0.1:${FRONTEND_PORT:-3102}","http://localhost:${BACKEND_PORT:-8102}","http://frontend:3102"]'
      REFERENCE_DATE: ${REFERENCE_DATE:-2026-08-17}
      DATASET_VERSION: ${DATASET_VERSION:-synthetic-v1}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini-2025-04-14}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1/}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8102}:8102'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8102/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m
    volumes:
      - ./data/manifests:/app/data/manifests
  frontend:
    build:
      context: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8102
      BACKEND_URL: http://backend:8102
      PORT: 3102
      HOSTNAME: 0.0.0.0
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-3102}:3102'
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3102').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend-check:
    profiles: [test]
    build:
      context: ./frontend
      target: checks
    mem_limit: 1g
  test-db:
    image: postgres:17.11-bookworm
    profiles: [test, evaluation]
    environment:
      POSTGRES_DB: loja_assistente_test
      POSTGRES_USER: loja_assistente
      POSTGRES_PASSWORD: test-only-password
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U loja_assistente -d loja_assistente_test']
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
  test:
    image: pf-loja-assistente-backend:local
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    profiles: [test]
    environment:
      <<: *backend_environment
      DATABASE_URL: postgresql+psycopg://loja_assistente:test-only-password@test-db:5432/loja_assistente_test
      TEST_DATABASE_URL: postgresql+psycopg://loja_assistente:test-only-password@test-db:5432/loja_assistente_test
      MYPY_CACHE_DIR: /tmp/loja-mypy
      RUFF_CACHE_DIR: /tmp/loja-ruff
      PYTEST_ADDOPTS: '-o cache_dir=/tmp/loja-pytest'
      LLM_ENABLED: 'false'
      OPENAI_API_KEY: ''
    depends_on:
      test-db:
        condition: service_healthy
    command: [python, /app/scripts/check.py]
    volumes:
      - ./backend:/app/backend
      - ./evals:/app/evals
      - ./scripts:/app/scripts:ro
    mem_limit: 1g
  evaluator:
    image: pf-loja-assistente-backend:local
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    profiles: [evaluation]
    environment:
      DATABASE_URL: postgresql+psycopg://loja_assistente:test-only-password@test-db:5432/loja_assistente_test
      TEST_DATABASE_URL: postgresql+psycopg://loja_assistente:test-only-password@test-db:5432/loja_assistente_test
      SESSION_SECRET: isolated-evaluation-secret-not-used-by-demo
      DEMO_MODE: 'true'
      LLM_ENABLED: 'false'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini-2025-04-14}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1/}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
    depends_on:
      test-db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend:ro
      - ./evals:/app/evals
      - ./.runtime:/app/.runtime
      - ./compose.yaml:/app/compose.yaml:ro
    command: [python, -m, evals.live_runner]
    mem_limit: 768m
volumes:
  postgres_data:
